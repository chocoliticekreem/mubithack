      <span>${secs(s.secs)}${s.running ? " …" : ""}${s.x ? ` <span class="xf">×${s.x} faster</span>` : ""}</span></div>
    <div class="bpair">${s.before_secs ? `<i class="before" style="width:${s.before_secs / max * 100}%" title="one at a time: ${secs(s.before_secs)}"></i>` : ""}<i class="after" style="width:${(s.secs || 0) / max * 100}%" title="Forge: ${secs(s.secs)}"></i></div></div>`).join("");
  return `${ups ? `<div class="tiles">${ups}</div>` : ""}
    <div class="key"><span><i style="background:var(--grey)"></i>one call at a time</span><span><i style="background:var(--green)"></i>Forge, agents side by side</span></div>
    <div class="bars">${bars}</div>
    <div class="small muted" style="margin-top:10px">${sp.calls} Mubit calls · median ${ms(sp.p50_ms) || "–"} · p90 ${ms(sp.p90_ms) || "–"}${g.team.has_timings ? "" : " · from calls.jsonl"}</div>`;
}

function renderAutopilot(g) {
  const A = g.autopilot;
  if (!A) return `<div class="empty">No autopilot run on this game. Start one with <code>forge autopilot ${esc(g.slug)}</code>.</div>`;
  const b = A.budget || {};
  const tiles = `<div class="tiles">
    <div class="tile ${A.state === "running" ? "hot" : ""}"><div class="k">Rounds</div><div class="v">${A.rounds.length}<small> ${esc(A.state || "")}${A.phase && A.state === "running" ? ` · ${esc(A.phase)}` : ""}</small></div></div>
    <div class="tile"><div class="k">Anomalies found</div><div class="v">${A.anomalies}</div></div>
    <div class="tile"><div class="k">Kept / rolled back</div><div class="v"><span class="ok">${A.kept}</span><small> / </small><span class="bad">${A.rolled_back}</span></div></div>
    <div class="tile"><div class="k">Budget</div><div class="v">${b.calls_used ?? 0}<small> / ${b.max_calls ?? "∞"} calls · ${b.minutes_used ?? 0} min</small></div></div>
  </div>`;
  const tr = A.trend || [];
  const W = 520, H = 120, pl = 26, pr = 60, pt = 8, pb = 20;
  const xs = i => pl + (tr.length <= 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (tr.length - 1));
  const ys = v => pt + (10 - v) * (H - pt - pb) / 10;
  const line = (key, color, name) => {
    const pts = tr.map((v, i) => v[key] != null ? [xs(i), ys(v[key]), v] : null).filter(Boolean);
    if (!pts.length) return "";
    const last = pts[pts.length - 1];
    return `<path d="${pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("")}" fill="none" stroke="${color}" stroke-width="2"/>
      ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${p[2].kept === false ? "var(--red)" : color}" stroke="var(--panel)" stroke-width="2"><title>round ${p[2].round} ${p[2].tag}: ${name} ${p[2][key]}${p[2].kept === false ? " (rolled back)" : ""}</title></circle>`).join("")}
      <text class="lbl" x="${last[0] + 8}" y="${last[1] + 4}">${name} ${last[2][key]}</text>`;
  };
  const chart = tr.length ? `<div class="key"><span><i style="background:${C_CRITIC}"></i>critic</span><span><i style="background:${C_FUN}"></i>fun</span><span><i style="background:var(--red)"></i>rolled back</span><span>per measurement, out of 10</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="critic and fun score per autopilot measurement">${[0, 5, 10].map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${pl - 6}" y="${ys(v) + 4}" text-anchor="end">${v}</text>`).join("")}${line("critic", C_CRITIC, "critic")}${line("fun", C_FUN, "fun")}</svg>` : "";
  const rows = A.rounds.slice().reverse().map(r => {
    const ev = Object.entries(r.evidence || {}).map(([k, n]) => `${esc(k)} ${n}`).join(" · ");
    const sb = (r.scores || {}).before || {}, sa = (r.scores || {}).after || {};
    const sc = sa.critic != null || sb.critic != null ? `critic ${sb.critic ?? "–"} → ${sa.critic ?? "–"}` : "";
    const decs = (r.decisions || []).map(d => `<div class="dec"><span>${d.picked ? "▶" : "·"}</span><span><b>${esc(d.title)}</b> <span class="muted">${esc(d.kind)} · ${d.score ?? ""}</span></span><span>${d.outcome ? pill(d.outcome.replace("_", " ")) : ""}</span><span class="r">${esc(d.reason || "")}</span></div>`).join("");
    const an = (r.anomalies || []).map(a => `<div class="small">${pill(a.severity || "medium")} ${esc(a.title)} <span class="muted">${esc((a.evidence || []).slice(0, 3).join(", "))}</span></div>`).join("");
    return `<div class="aprow ${esc(r.verdict || "")}"><div class="hd"><span class="chip">round ${r.round}</span>${pill((r.verdict || "").replace("_", " "))}${r.version ? `<code>${esc(r.version)}</code>` : ""}<span class="small muted">${r.anomalies_n} anomalies · ${r.gaps} gaps · ${r.evidence_items ?? 0} evidence items · pre-filter ${r.prefilter ?? 0}${sc ? ` · ${esc(sc)}` : ""}</span></div>
      <div class="ev">${ev}</div>
      <div class="small" style="margin:4px 0"><b>What improved:</b> ${esc(r.what_improved || "–")}<br><b>Why:</b> ${esc(r.why || "–")}</div>
      ${an}${decs}</div>`;
  }).join("");
  return `${tiles}${chart}${A.stop_reason ? `<div class="small muted">Stopped: ${esc(A.stop_reason)}</div>` : ""}${rows || `<div class="empty small">Round 1 is measuring the baseline…</div>`}`;
}

function renderLightbox() {
  if (!LB) { $("lightbox").classList.remove("open"); return; }

  const keys = Object.keys(SHOTS).filter(k => k.startsWith(t.run + "#")).sort((a, b) => +a.split("#")[1] - +b.split("#")[1]);
  const i = keys.indexOf(LB);
  const asserts = (s.assertions || []).map(a => `<li><span class="badge ${a.ok === true ? "pass" : a.ok === false ? "fail" : "none"}" style="${a.ok === true ? "background:var(--green)" : a.ok === false ? "background:var(--red);color:#fff" : "background:var(--grey)"}">${a.ok === true ? "✓" : a.ok === false ? "✗" : "·"}</span>
    <span>${esc(a.text)}${a.detail ? `<small>${esc(a.detail)}</small>` : ""}</span></li>`).join("");
  $("lb").innerHTML = `<div class="pic">${s.shot ? `<img src="${esc(s.shot)}" alt="${esc(t.label)} step ${s.n}">` : `<span class="muted">no screenshot for this step</span>`}</div>
    <div><div class="actions"><span class="chip">${esc(t.label)} · step ${s.n}</span><button class="x" id="lbClose" aria-label="Close">✕</button></div>

      ${s.reason ? `<div class="fact"><span class="lbl">Why (its thought)</span>${esc(s.reason)}</div>` : ""}
      ${s.result ? `<div class="fact" style="margin-top:8px"><span class="lbl">What happened</span>${esc(s.result)}</div>` : ""}
      ${asserts ? `<div class="fact" style="margin-top:8px"><span class="lbl">Assertions</span><ul class="asserts">${asserts}</ul></div>` : ""}

const STAMP = {ok: "✓ answered", bad: "✗ failed", pend: "… pending"};

function callTipHtml(ln, t) {
  const st = tipState(t);
  const checks = (t.checks || []).map(c => `<li class="${c.ok === true ? "ok" : c.ok === false ? "bad" : "pend"}"><b>${c.ok === true ? "✓" : c.ok === false ? "✗" : "·"}</b>${esc(c.text)}</li>`).join("");
  return `<div class="tip-head"><span class="tip-who">${esc(ln.label)}</span><span class="stamp ${st}">${STAMP[st]}</span></div>
    ${t.head && t.head.toLowerCase() !== String(ln.label).toLowerCase() ? `<div class="tip-title">${esc(t.head)}</div>` : ""}
    ${(t.lines || []).map((x, i) => `<div class="tip-line${/^mreq_/.test(x) ? " rid" : ""}${i === 0 && st === "bad" && /Error|error|failed/.test(x) ? " err" : ""}">${esc(x)}</div>`).join("")}
    ${checks ? `<ul class="tip-checks">${checks}</ul>` : ""}`;
}

function placeTip(e, tip) {
  tip.style.display = "block";
  const x = Math.min(e.clientX + 16, innerWidth - tip.offsetWidth - 10);
  const y = e.clientY + 18 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 12 : e.clientY + 18;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}

function agentTipHtml(a) {
  const rows = (a.recent || []).map(c => { const st = tipState(c);
    return `<li class="${st}"><b>${st === "ok" ? "✓" : st === "bad" ? "✗" : "…"}</b><span>${esc(c.step || {ok: "answered", bad: "failed", pend: "cut short"}[st])}<small>${esc(ago(c.ts))}${c.latency_ms ? ` · ${ms(c.latency_ms)}` : ""}</small></span></li>`; }).join("");
  const st = a.running ? "pend" : a.failed ? "bad" : "ok";
  return `<div class="tip-head"><span class="tip-who">${esc(roleName(a.role))}</span><span class="stamp ${st}">${a.running ? "… working" : a.failed ? `✗ ${a.failed} failed` : "✓ all answered"}</span></div>
    <div class="tip-title">${a.calls} call${a.calls === 1 ? "" : "s"} · latest first</div>
    ${rows ? `<ul class="tip-checks tip-calls">${rows}</ul>` : ""}<div class="tip-line" style="margin-top:6px">click for what it did</div>`;
}

function showTip(e) {
  const tip = $("tip"), l = e.target.closest("[data-tipl]"), ag = e.target.closest("[data-tipa]");
  if (ag) {
    const a = (game()?.agents || [])[+ag.dataset.tipa];
    if (!a) { tip.style.display = "none"; return; }
    tip.className = "tip call"; tip.innerHTML = agentTipHtml(a); placeTip(e, tip); return;
  }
  if (l) {
    const [li, si] = l.dataset.tipl.split(":").map(Number);
    const ln = game()?.team?.lanes?.lanes?.[li], t = ln?.tips?.[si];
    if (!t) { tip.style.display = "none"; return; }
    tip.className = "tip call"; tip.innerHTML = callTipHtml(ln, t); placeTip(e, tip); return;
  }
  const r = e.target.closest("[data-tipv]");
  if (!r) { tip.style.display = "none"; return; }
  const v = game()?.team?.timeline[+r.dataset.tipv]; if (!v) return;
  tip.className = "tip";
  tip.innerHTML = `<b>${esc(v.version)}</b> · ${esc(v.title)}<br>critic ${v.score ?? "–"}${v.fun != null ? ` · fun ${v.fun}` : ""}${v.delta ? ` · ${v.delta > 0 ? "+" : ""}${v.delta}` : ""}<br>+${v.added} −${v.removed} lines in ${v.files} files${v.summary ? `<br><span style="opacity:.8">${esc(v.summary)}</span>` : ""}`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = (e.clientY + 14) + "px";
}

function renderPicker() {
  const html = DATA.games.map(g => `<option value="${esc(g.slug)}" ${g.slug === game()?.slug ? "selected" : ""}>${g.live ? "● " : ""}${esc(g.title)} · ${esc(g.slug.slice(0, 28))}</option>`).join("");
  put("pick", html);
}

// ------------------------------------------------------------------ snapshot detail + rollback
function renderDetail() {
  const g = game(), m = g?.missions.find(x => x.version === DETAIL);
  if (!m) { $("scrim").classList.remove("open"); return; }
  const prev = g.missions[m.n - 2];
  const next = g.versions.length + 1;
  const busy = !!g.live;
  const confirm = CONFIRM ? `<div class="confirm"><p>Go back to ${esc(CONFIRM)}? It is saved as a <u>new</u> version (v${next}). Nothing is lost: v1 to ${esc(g.versions[g.versions.length - 1]?.version)} all stay, so you can come back any time.</p>
      <div class="actions"><button class="btn red" id="doRollback" ${BUSY ? "disabled" : ""}>${BUSY ? "Going back…" : `Yes, go back to ${esc(CONFIRM)}`}</button><button class="btn ghost" id="noRollback">Cancel</button></div></div>` : "";
  $("sheet").innerHTML = `<div class="top">${chestSvg(m.kind, {open: true, glow: m.kind !== "save"})}
      <div><span class="chip">${esc(m.version)} · ${esc(KIND[m.kind]?.label || "Snapshot")}</span><h3 style="margin-top:6px">${esc(m.title)}</h3></div>
      <button class="x" id="closeSheet" aria-label="Close">✕</button></div>
    <div class="facts">
      <div class="fact"><span class="lbl">What happened</span>${esc(m.message.split("\n")[0])}</div>
      <div class="fact"><span class="lbl">Files changed</span>${m.files ? `${m.files} file${m.files === 1 ? "" : "s"}` : "none (same files as before)"}
        ${m.file_list.length ? `<details><summary class="small">show files</summary><ul class="files">${m.file_list.map(f => `<li>${esc(f)}</li>`).join("")}${m.files > m.file_list.length ? `<li>…and ${m.files - m.file_list.length} more</li>` : ""}</ul></details>` : ""}</div>
      ${m.fixes.length ? `<div class="fact"><span class="lbl">Fixes kept (the Checker confirmed them)</span>${m.fixes.map(esc).join("<br>")}</div>` : ""}
      ${m.score != null ? `<div class="fact"><span class="lbl">Critic score for this version</span>${m.score}/10</div>` : ""}
      <div class="fact"><span class="lbl">Saved</span>${esc(when(m.date))}</div>
    </div>
    <div class="actions">
      ${prev ? `<button class="btn" data-goto="${esc(prev.version)}" ${busy ? "disabled" : ""}>↩ Go back to ${esc(prev.version)}</button>` : ""}
      ${!m.current ? `<button class="btn ghost" data-goto="${esc(m.version)}" ${busy ? "disabled" : ""}>Restore ${esc(m.version)}</button>` : ""}
      ${busy ? `<span class="small muted">Wait for the team to finish this mission first.</span>` : `<span class="small muted">Going back saves a new version. Nothing is lost.</span>`}
    </div>${confirm}`;
  $("scrim").classList.add("open");
}

function openDetail(v) { DETAIL = v; CONFIRM = null; renderDetail(); last.main = last.mapBox = null; renderMain(); }
function closeDetail() { DETAIL = null; CONFIRM = null; $("scrim").classList.remove("open"); last.main = last.mapBox = null; renderMain(); }

function note(text) { const n = $("note"); n.textContent = text; n.classList.remove("show"); void n.offsetWidth; n.classList.add("show"); clearTimeout(note.t); note.t = setTimeout(() => n.classList.remove("show"), 4200); }

async function doRollback() {
  const g = game(); BUSY = true; renderDetail();
  try {
    const r = await fetch("/api/rollback", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({slug: g.slug, version: CONFIRM})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    seen[g.slug] = (seen[g.slug] || 0) + 1;  // our own rollback: no chest launch for it
    note(`Back to ${d.restored}, saved as ${d.as}. Nothing lost.`);
    BUSY = false; closeDetail(); await refresh();
  } catch (e) { BUSY = false; CONFIRM = null; renderDetail(); note(`Couldn't go back: ${e.message}`); }
}

// ------------------------------------------------------------------ chest launch
function launch(m) {
  return new Promise(resolve => {
    const L = $("launch");
    $("bigChest").innerHTML = chestSvg(m.kind, {inside: true}) + Array.from({length: 8}, (_, i) => {
      const a = i / 8 * Math.PI * 2; return `<i class="coin" style="--dx:${Math.cos(a) * 140 - 9}px;--dy:${Math.sin(a) * 110 - 60}px"></i>`; }).join("");
    $("toastWhat").textContent = m.title;
    $("toastSub").textContent = `${m.version} saved${m.files ? ` · ${m.files} file${m.files === 1 ? "" : "s"} changed` : ""}${m.score != null ? ` · score ${m.score}/10` : ""}`;
    L.classList.remove("go", "out"); void L.offsetWidth; L.classList.add("open", "go");
    let done = false;
    const finish = () => { if (done) return; done = true; L.classList.add("out"); setTimeout(() => { L.classList.remove("open", "go", "out"); resolve(); }, 380); };
    L.onclick = finish;
    setTimeout(finish, matchMedia("(prefers-reduced-motion: reduce)").matches ? 2600 : 4400);
  });
}

async function play() {
  if (playing) return; playing = true;
  while (queue.length) await launch(queue.shift());
  playing = false;
}

function noticeNew() {
  for (const g of DATA.games) {
    const n = g.versions.length;
    if (seen[g.slug] == null) { seen[g.slug] = n; continue; }
    if (n > seen[g.slug] && g.slug === game()?.slug && moreOn()) queue.push(...g.missions.slice(seen[g.slug]).filter(isMission));
    seen[g.slug] = n;
  }
  play();
}

// ------------------------------------------------------------------ nerd view (the old dashboard)
const pill = s => `<span class="pill s-${esc(String(s).split(" ")[0])}">${esc(s)}</span>`;
const nopen = new Set();
document.addEventListener("toggle", e => { const id = e.target.dataset?.key; if (id) e.target.open ? nopen.add(id) : nopen.delete(id); }, true);
const det = (key, summary, body) => `<details data-key="${esc(key)}" ${nopen.has(key) ? "open" : ""}><summary>${summary}</summary>${body}</details>`;
function renderRunning(list) {
  if (!list.length) return `<div class="empty">Nothing running. Start one with forge fix, forge new or the forge MCP tools.</div>`;
  return list.map(r => `<div class="card"><div class="row"><div class="grow ttl">${esc(r.name)}</div>${pill(r.status)}</div>
    <div class="muted small">${esc(r.command)} · ${ago(r.updated)}</div>
    ${det("run:" + r.name, `<span class="small">log (${r.tail.length} lines)</span>`, `<pre>${esc(r.tail.join("\n"))}</pre>`)}</div>`).join("");
}
function renderMubit(m) {
  if (!m.roles.length) return `<div class="empty">No Mubit calls recorded yet.</div>`;
  return `<div class="card"><div class="small muted" style="margin-bottom:6px">${m.total} calls · a task trains at ${m.train_at} kept examples · <a href="${esc(m.console)}" target="_blank" rel="noopener">open the Mubit console</a></div>
  <table><thead><tr><th>role (task)</th><th>calls</th><th>toward training</th><th>latest request</th></tr></thead><tbody>
  ${m.roles.map(r => { const pct = Math.min(100, r.calls / m.train_at * 100);
    return `<tr><td>${esc(r.role)}</td><td>${r.calls}</td><td><div class="bar ${pct >= 100 ? "done" : ""}"><i style="width:${pct}%"></i></div></td><td><code>${esc(r.latest.request_id || "")}</code></td></tr>`; }).join("")}
  </tbody></table></div>`;
}
const anomaly = a => `<div class="item">${pill(a.severity)} <b>${esc(a.title)}</b> <span class="muted small">${esc(a.system)} · ${esc(a.kind)}</span><div class="small">${esc(a.observed)}</div></div>`;
function fixItem(f) {
  const tries = (f.attempts || []).map((t, i) => `<div class="small">try ${i + 1}: ${pill(t.status)} ${esc(t.verdict?.evidence || t.error || "")}</div>`).join("");
  return `<div class="item">${pill(f.status)} <b>${esc(f.anomaly)}</b> <code>${esc(f.path || "")}</code> ${f.version ? `<span class="muted small">→ ${esc(f.version)}</span>` : ""}${tries}${f.patch ? `<div class="small muted">patch: ${esc(f.patch)}</div>` : ""}</div>`;
}
function renderNerdGame(g) {
  const iters = g.iterations.length ? `<div class="sec"><h3>Iterations</h3><table><thead><tr><th>#</th><th>score</th><th>version</th><th>summary</th></tr></thead><tbody>${
    g.iterations.map(i => `<tr><td>${i.n}</td><td>${i.score ?? "–"}</td><td>${esc(i.version || "")}${i.rolled_back_to ? ` ↩ ${esc(i.rolled_back_to)}` : ""}</td><td class="small">${esc((i.summary || "").slice(0, 220))}</td></tr>`).join("")}</tbody></table></div>` : "";
  const cycles = g.cycles.slice().reverse().map(c => `<div class="sec"><h3>Cycle ${c.cycle} · ${esc((c.ts || "").slice(0, 19))} · open ${c.open ?? "–"} · planted ${c.planted}, detected ${c.detected}</h3>
    ${(c.anomalies || []).map(anomaly).join("") || '<div class="small muted">no anomalies</div>'}${(c.code_fixes || []).map(fixItem).join("")}
    ${(c.verdicts || []).map(vd => `<div class="item small">fault ${esc(vd.fault)}: ${pill(vd.verdict)} ${esc(vd.evidence)}</div>`).join("")}</div>`).join("");
  const versions = g.versions.length ? `<div class="sec"><h3>Versions</h3><table><tbody>${g.versions.slice().reverse().map(x =>
    `<tr><td><code>${esc(x.version)}</code></td><td class="small muted">${esc(x.date.slice(0, 19))}</td><td class="small">${esc(x.message.split("\n")[0])}</td></tr>`).join("")}</tbody></table></div>` : "";
  const feats = g.features.length ? `<div class="sec"><h3>Features</h3>${g.features.map(f => `<div class="item small">${esc(f.request)} → ${esc(f.version || "")} ${f.verified == null ? "" : pill(f.verified ? "fixed" : "not_fixed")}</div>`).join("")}</div>` : "";
  const reports = g.reports.length ? `<div class="sec"><h3>Tester reports</h3>${g.reports.slice().reverse().map(r =>
    `<div class="item"><div class="small muted">${esc(r.ts)} ${esc(r.reporter || "")}</div><div>“${esc(r.text)}”</div>${r.anomalies.map(anomaly).join("")}</div>`).join("")}</div>` : "";
  const calls = Object.keys(g.calls).length ? `<div class="sec"><h3>Mubit calls</h3><div class="small">${Object.entries(g.calls).map(([k, n]) => `${esc(k)} ${n}`).join(" · ")}</div></div>` : "";
  return `<div class="card"><div class="row"><div class="grow"><div class="ttl">${esc(g.title)}</div><div class="muted small">${esc(g.slug)} · ${ago(g.updated)}</div></div>${g.live ? pill("running") : ""}</div>
    ${det("game:" + g.slug, `<span class="small">details</span>`, iters + cycles + versions + feats + reports + calls)}</div>`;
}
function renderNerd() {
  if (!moreOn()) return;
  put("running", renderRunning(DATA.running));
  put("mubit", renderMubit(DATA.mubit));
  put("games", DATA.games.length ? DATA.games.map(renderNerdGame).join("") : '<div class="empty">No games yet.</div>');
}

function pickGame(slug) { SEL = slug; store.set("forge.sel", SEL); queue.length = 0; renderPicker(); renderCondensed(); if (moreOn()) renderMain(); }
$("pick").addEventListener("change", e => { if (e.target.value) pickGame(e.target.value); });
$("moreBtn").addEventListener("click", e => { const on = document.body.classList.toggle("more"); e.target.setAttribute("aria-pressed", on); e.target.textContent = on ? "Less" : "More"; store.set("forge.more", on ? "1" : ""); if (DATA && on) { renderMain(); renderNerd(); } });
if (store.get("forge.more")) $("moreBtn").click();
$("nowBox").addEventListener("click", e => { const r = e.target.closest("[data-slug]"); if (r) pickGame(r.dataset.slug); });
$("agentsBox").addEventListener("click", e => { const a = e.target.closest("[data-role]"); if (a) AGENT?.role === a.dataset.role ? closeAgent() : openAgent(a.dataset.role); });
$("drawer").addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeAgent();
  const sh = e.target.closest("[data-shot]"); if (sh) { LB = sh.dataset.shot; renderLightbox(); }
});
$("team").addEventListener("click", e => {
  const sh = e.target.closest("[data-shot]"); if (sh) { LB = sh.dataset.shot; renderLightbox(); }
});
document.addEventListener("mousemove", showTip);
$("team").addEventListener("mouseleave", () => { $("tip").style.display = "none"; });
$("lightbox").addEventListener("click", e => {
  if (e.target === $("lightbox") || e.target.closest("#lbClose")) { LB = null; return renderLightbox(); }
  if (e.target.closest("#lbPrev") && $("lb").dataset.prev) { LB = $("lb").dataset.prev; renderLightbox(); }
  if (e.target.closest("#lbNext") && $("lb").dataset.next) { LB = $("lb").dataset.next; renderLightbox(); }
});
$("mapBox").addEventListener("click", e => {
  const slot = e.target.closest(".slot"); if (slot) return openDetail(slot.dataset.v);
  if (e.target.closest("#replay")) { queue.length = 0; queue.push(...game().missions.filter(m => isMission(m) && !/^Playtest round/.test(m.title))); play(); }
});
$("scrim").addEventListener("click", e => {
  if (e.target === $("scrim") || e.target.closest("#closeSheet")) return closeDetail();
  const go = e.target.closest("[data-goto]"); if (go) { CONFIRM = go.dataset.goto; return renderDetail(); }
  if (e.target.closest("#noRollback")) { CONFIRM = null; return renderDetail(); }
  if (e.target.closest("#doRollback")) return doRollback();
});
document.addEventListener("keydown", e => {
  if (LB) {
    if (e.key === "Escape") { LB = null; renderLightbox(); }
    else if (e.key === "ArrowLeft" && $("lb").dataset.prev) { LB = $("lb").dataset.prev; renderLightbox(); }
    else if (e.key === "ArrowRight" && $("lb").dataset.next) { LB = $("lb").dataset.next; renderLightbox(); }
    return;
  }
  if (e.key === "Escape" && DETAIL) closeDetail();
  else if (e.key === "Escape" && AGENT) closeAgent();
});

async function refresh() {
  try {
    const r = await fetch("/api/state", {cache: "no-store", signal: AbortSignal.timeout(20000)});
    DATA = await r.json();
    if (!DATA.games.some(g => g.slug === SEL)) SEL = DATA.games[0]?.slug;
    renderPicker(); renderCondensed(); if (moreOn()) renderMain(); renderNerd(); noticeNew(); loadAgent();
    const deep = decodeURIComponent(location.hash).match(/^#shot=(.+)$/);  // link straight to one screenshot
    if (deep && SHOTS[deep[1]] && LB !== deep[1]) { LB = deep[1]; renderLightbox(); history.replaceState(null, "", location.pathname); }
    $("updated").textContent = `Updated ${new Date().toLocaleTimeString()} · refreshes every 3s · characters, chests and trophy are hand-drawn SVG for Forge · agents are Bottts by Pablo Stanley via DiceBear · fonts Fredoka and Nunito (Google Fonts, OFL)`;
  } catch (e) {
    $("updated").textContent = "Can't reach forge dashboard: is it still running?";
  }
}
// The next poll starts only after this one has finished: overlapping polls used to stack up while a slow
// state build ran, and every one of them rebuilt the whole state.
(async function poll() { await refresh(); setTimeout(poll, 3000); })();
</script>
</body>
</html>
