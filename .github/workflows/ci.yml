name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install luau
        run: |
          curl -fsSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          sudo unzip -o luau.zip -d /usr/local/bin && luau-compile --help >/dev/null 2>&1 || true
          which luau-compile
      - name: Install
        run: uv venv && uv pip install -e ".[dev]"
      - name: Luau syntax check
        run: python3 game/tools/sync.py check --root game
      - name: Luau unit specs
        run: bash game/tests/run.sh
      - name: Tests
        run: .venv/bin/python -m pytest -q
