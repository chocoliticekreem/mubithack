[project]
name = "forge"
version = "0.1.0"
description = "Self-improving Roblox game builder: idea -> Luau -> Studio playtest -> fix, every LLM call through Mubit"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "openai>=1.50",
  "mcp>=1.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
forge = "forge.cli:main"
mubit-tester = "mubit_tester.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge", "mubit-tester/mubit_tester"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mubit-tester/tests"]
